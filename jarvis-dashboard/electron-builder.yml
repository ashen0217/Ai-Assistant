appId: com.jarvis.ai
productName: Jarvis
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
# Bundle the compiled Python backend and .env into the installer.
# --onedir mode produces: backend-dist/core_engine/core_engine.exe + all DLLs
# We copy the whole core_engine/ folder into resources/backend-dist/ so the
# exe lands at resources/backend-dist/core_engine.exe with DLLs alongside it.
extraResources:
  - from: '../backend-dist/core_engine'
    to: 'backend-dist'
    filter:
      - '**/*'
  - from: '../.env'
    to: 'backend-dist/.env'
asarUnpack:
  - resources/**
win:
  executableName: Jarvis
  target:
    - target: nsis
      arch:
        - x64
  # Request microphone access on Windows (important for wake word)
  requestedExecutionLevel: asInvoker
nsis:
  artifactName: Jarvis-${version}-Setup.${ext}
  shortcutName: Jarvis
  uninstallDisplayName: Jarvis AI Assistant
  createDesktopShortcut: always
  createStartMenuShortcut: true
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
publish:
  provider: generic
  url: https://example.com/auto-updates
